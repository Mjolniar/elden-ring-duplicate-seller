# ERDuplicateSeller mutation routine candidate template
#
# This file is inert as long as it keeps the .example.ini name. The DLL only
# attempts to load mutation_routines.ini from beside ERDuplicateSeller.dll.
# Keep every candidate at candidate/read-only status until local throwaway-save
# validation proves otherwise.
#
# Supported keys:
# kind=remove_item | add_runes
# removal_strategy=game_routine | custom_container_edit
# name=<human-readable label>
# supported_game_version=2.6.2.0
# source=<where this candidate came from>
# pattern=<signature bytes, if available>
# module_rva=<module-relative RVA, if available>
# status=candidate | signature_matched | read_only_observed | no_op_validated | rejected
# custom_inventory_layout_validated=true|false
# custom_recognized_removal_shape_validated=true|false
# custom_empty_slot_sentinel_validated=true|false
# custom_count_order_repair_validated=true|false
# custom_reload_roundtrip_validated=true|false
# blocker=<reason this candidate must not execute>
#
# Example:
#
# [routine]
# kind=remove_item
# name=Example remove-item candidate
# removal_strategy=game_routine
# supported_game_version=2.6.2.0
# source=local research note, not validated
# pattern=48 89 5C 24 ??
# status=candidate
# blocker=example only; no local validation
#
# Custom removal candidates intentionally do not require a game routine locator,
# but they cannot pass the mutation gate unless every custom_* validation key is
# true and the current runtime has independently reached throwaway_save_validated.
# The recognized-removal-shape flag must come from a fresh before/after
# InventoryChangeAnalysis result such as compacted_and_count_decremented,
# not from tail_range_cleared, added_or_unexpected, or unknown.
#
# [routine]
# kind=remove_item
# name=Example custom container edit candidate
# removal_strategy=custom_container_edit
# supported_game_version=2.6.2.0
# source=throwaway-save custom removal notes, not validated
# status=candidate
# custom_inventory_layout_validated=false
# custom_recognized_removal_shape_validated=false
# custom_empty_slot_sentinel_validated=false
# custom_count_order_repair_validated=false
# custom_reload_roundtrip_validated=false
# blocker=example only; custom row editing has not been validated
#
# [routine]
# kind=add_runes
# name=Example rune-award candidate
# supported_game_version=2.6.2.0
# source=local research note, not validated
# module_rva=0x0
# status=candidate
# blocker=example only; no local validation

[routine]
kind=add_runes
name=Hexinton AddSoul_Call candidate
supported_game_version=2.6.2.0
source=Hexinton all-in-one CE table v6.1; see docs/CT_RESEARCH.md
pattern=44 8B 49 6C 45 33 DB
status=candidate
blocker=CE call shape is unvalidated from this DLL; no live rune-award call is implemented
blocker=No matching remove-item routine has been validated, so duplicate selling must stay dry-run
