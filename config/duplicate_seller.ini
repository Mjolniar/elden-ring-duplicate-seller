# ERDuplicateSeller config
# Legacy diagnostic profile. For the validated native seller, use provisional_2710.ini.
# Offline modded play only. Keep dry_run=true during initial validation.

enabled=true
dry_run=true
; Opt-in provisional 2.7.1.0 native seller; set the validated version and layout too.
native_sale_enabled=false
; Zero sells all eligible equipment; one limits a validation run to one item.
native_sale_max_items=0

# F8. Uses Windows virtual-key codes.
hotkey_vk=0x77

# Fallback number of eligible copies to keep per base item ID.
keep_count=1

# Category-specific defaults for one-button duplicate selling.
keep_weapons=2
keep_shields=1
keep_armor=1
keep_talismans=1
keep_ashes_of_war=1
keep_spells=1
keep_consumables=0

# Weapon-family duplicates are grouped by normalized base weapon ID. The planner
# keeps the highest-upgrade copies first, so keep_weapons=2 keeps the best two
# versions of each weapon base and plans lower-priority duplicates for sale.
# Consumables are not quick-sold unless sell_consumables=true.
sell_weapons=true
sell_shields=true
sell_armor=true
sell_talismans=true
sell_ashes_of_war=true
sell_spells=false
sell_consumables=false

# Optional per-item stock rules, used only for items in sell-enabled categories.
# Format: item_id:copies_to_keep,item_id:copies_to_keep
# Example: item_stock_rules=500000:99,501000:99
item_stock_rules=

# These flags remain for non-weapon categories and compatibility with older
# fixtures. Weapon/shield duplicates use the keep-best policy above.
require_unupgraded=true
require_unmodified=true

# Refuse read-only adapter readiness unless eldenring.exe has this file version.
# Leave this at the locally validated version unless the adapter is revalidated.
supported_game_version=2.6.2.0

# Optional read-only candidate value scanner. This is disabled unless both
# memory_scan_enabled=true and memory_scan_hotkey_vk is explicitly set.
# The scanner reads memory only, logs candidate RVAs relative to the module
# base, and never enables inventory decoding or item selling.
# To use it, set memory_scan_enabled=true and a hotkey distinct from hotkey_vk,
# e.g. F7 (0x76). See docs/MEMORY_SCAN_WORKFLOW.md.
memory_scan_enabled=false
memory_scan_hotkey_vk=
memory_scan_value_size=4

# Scan budget. Defaults are sized for a large game process so a single pass
# does not truncate before reaching the target. If a scan logs truncated=1,
# raise memory_scan_max_bytes_mb. Higher values scan more memory per pass.
memory_scan_max_bytes_mb=3072
memory_scan_max_regions=65536
memory_scan_max_candidates=65536

# Optional read-only pointer-path scan. After the value scan narrows to a stable
# candidate, this searches for a static [module + rva] -> +offsets chain that is
# reproducible across launches (a raw heap address is not). Set a distinct hotkey,
# e.g. F6 (0x75). Requires memory_scan_enabled=true. See docs/MEMORY_SCAN_WORKFLOW.md.
pointer_scan_hotkey_vk=
pointer_scan_max_depth=3
pointer_scan_offset_window=0x800

# Hands-free automation (recommended over hotkeys). When auto_scan_enabled=true, the DLL
# watches memory_scan_target.txt and, each time you save a new value, scans and narrows,
# then automatically runs the pointer scan once candidates drop to auto_scan_pointer_threshold.
# No hotkeys are used in this mode. Requires memory_scan_enabled=true.
#
# Manual runtime actions can also be triggered without keyboard focus by writing a command
# to runtime_command.txt beside the DLL after launch:
# inventory_preflight, inventory_snapshot, field_dump, verify_chains <value>, help
auto_scan_enabled=false
auto_scan_pointer_threshold=8

# Chain verification. When true, on load the DLL resolves each pointer chain listed in
# pointer_chains.txt (beside the DLL) against the current process and logs the value each
# lands on. Relaunch a few times with this on to confirm which chains stay valid.
pointer_chain_verify_enabled=false

# Optional read-only struct field dump. This shares the memory_scan_target.txt save trigger
# used by verify mode, resolves field_dump_chain to a struct base, then classifies each
# qword slot as an integer-like low32 value and/or candidate readable pointer. It does not
# dereference candidate pointers and does not decode inventory.
# The chain must resolve to the struct BASE to dump, so end it with +0x0 (a final offset
# that is added but not dereferenced). Example resolving to PlayerGameData on 2.6.2.0
# (GameDataMan at +0x3d5df38, PlayerGameData pointer at +0x8):
# field_dump_chain=[module+0x3d5df38]+0x8+0x0
field_dump_enabled=false
field_dump_chain=
field_dump_bytes=0x400
field_dump_stride=8

# Optional read-only live inventory report. This shares the memory_scan_target.txt save
# trigger, resolves inventory_base_chain to PlayerGameData, reads only the configured
# count/array/entry fields, decodes weapon-family upgrade/affinity suffixes
# conservatively from item IDs, and logs formatInventoryReport output. It does not make
# probe inventory_read_ready true and does not sell or mutate anything.
# Example only for the locally validated 2.6.2.0 layout:
# inventory_base_chain=[module+0x3d5df38]+0x8+0x0
# inventory_array_offset=0x418
# inventory_count_offset=0x420
# inventory_entry_stride=0x18
# inventory_handle_offset=0x0
# inventory_itemid_offset=0x4
# inventory_quantity_offset=0x8
# Set inventory_snapshot_export_enabled=true while collecting read-only snapshots
# for InventoryChangeCli comparison. When both inventory_read_enabled=true and
# inventory_snapshot_export_enabled=true, the DLL automatically exports one
# snapshot on start and then waits inventory_snapshot_auto_interval_seconds after
# each completed read/export before starting the next one. The default 5-second
# cooldown is intentionally short but non-overlapping. Set it to 0 to disable
# timed snapshots and fall back to the manual watched-file trigger. Automatic
# snapshots skip the full dry-run report by default so large inventories can be
# sampled quickly; manual watched-file triggers still print the full report.
# Files are written next to ERDuplicateSeller.dll as inventory_snapshot_*.txt.
# inventory_snapshot_retention_count keeps only the newest matching snapshots;
# set it to 0 to disable cleanup. Snapshot exports include comment-only raw
# diagnostics: qwords from the configured PlayerGameData header range and u32
# words for a focused row range. These comments are ignored by the snapshot
# parser but preserve evidence for layout debugging.
inventory_read_enabled=false
inventory_base_chain=
inventory_array_offset=0
inventory_count_offset=0
# Optional validated normal-array capacity field (2.7.1.0 research: 0x414).
# Zero retains the legacy read mode. Never use combined capacity at 0x410.
inventory_capacity_offset=0
inventory_entry_stride=0
inventory_handle_offset=0
inventory_itemid_offset=0
inventory_quantity_offset=0
inventory_max_entries=512
inventory_snapshot_export_enabled=false
inventory_snapshot_auto_interval_seconds=5
inventory_snapshot_auto_run_on_start=true
inventory_snapshot_auto_dry_run_report_enabled=false
inventory_snapshot_retention_count=24
inventory_snapshot_header_offset=0x400
inventory_snapshot_header_bytes=0x40
inventory_snapshot_focus_start=288
inventory_snapshot_focus_count=32

# Optional raw entry diagnostics for read-only layout discovery. When enabled,
# the reader logs bounded u32 slots from decoded inventory entries. This is only
# for finding upgrade/modified/sell-value fields and still does not write memory.
inventory_entry_diagnostics_enabled=false
inventory_entry_diagnostics_max=64
inventory_entry_diagnostics_include_consumables=false

# Optional read-only handle-reference diagnostics. This scans private readable
# memory for decoded item handles and logs bounded u32 context around matches.
# It is for locating related instance structures; it does not follow pointers
# from raw slots and does not mutate memory.
inventory_handle_diagnostics_enabled=false
inventory_handle_diagnostics_max_handles=32
inventory_handle_diagnostics_max_matches_per_handle=8
inventory_handle_diagnostics_max_bytes_mb=1024
inventory_handle_diagnostics_include_consumables=false

# Optional read-only compact-row diagnostics. This searches for exact decoded
# 16-byte rows shaped as handle, base item ID, category code, quantity, then
# groups contiguous rows. It is for finding candidate item-instance arrays and
# does not mutate memory.
inventory_compact_row_diagnostics_enabled=false
inventory_compact_row_diagnostics_max_targets=128
inventory_compact_row_diagnostics_max_rows=512
inventory_compact_row_diagnostics_max_bytes_mb=1024
inventory_compact_row_diagnostics_min_run_length=4
inventory_compact_row_diagnostics_max_runs=32
inventory_compact_row_diagnostics_include_consumables=false

# Optional read-only compact-row dump. When enabled after a compact row scan,
# this dumps bounded full rows around the strongest compact_row_run candidates.
# The default backtrack of 0x10 means the known 16-byte item block starts after
# four u32 preamble words in the dumped row. This is raw evidence only and does
# not decode upgrade/modified state by itself.
inventory_compact_row_dump_enabled=false
inventory_compact_row_dump_max_runs=1
inventory_compact_row_dump_max_rows_per_run=16
inventory_compact_row_dump_backtrack_bytes=0x10
inventory_compact_row_dump_max_stride_bytes=0x100

# Optional item metadata sources for names/categories used in logging and
# reporting only. Leave blank to skip. These do not affect sale safety.
# Example (randomizer output folder):
# metadata_iteminfo_path=C:\Users\ExampleUser\Desktop\randomizer\diste\Base\iteminfo.txt
# metadata_weapon_names_path=C:\Users\ExampleUser\Desktop\randomizer\diste\Names\EquipParamWeapon.txt
# metadata_protector_names_path=C:\Users\ExampleUser\Desktop\randomizer\diste\Names\EquipParamProtector.txt
# metadata_accessory_names_path=C:\Users\ExampleUser\Desktop\randomizer\diste\Names\EquipParamAccessory.txt
# metadata_goods_names_path=C:\Users\ExampleUser\Desktop\randomizer\diste\Names\EquipParamGoods.txt
metadata_iteminfo_path=
metadata_weapon_names_path=
metadata_protector_names_path=
metadata_accessory_names_path=
metadata_goods_names_path=

# Optional sell-value table for read-only dry-run rune estimates. Preferred
# format is one "category id value" row per line, e.g. "weapon 100000 100".
# Legacy "id value" rows are accepted as category-agnostic fallback rows.
# This is not loaded from live PARAM memory and does not enable selling.
# Example:
# sell_value_path=C:\Users\ExampleUser\Desktop\erdup_sell_values.txt
sell_value_path=
