# Provisional native seller for the validated Elden Ring 2.7.1.0 executable.
# Copy as duplicate_seller.ini beside the DLL. Prices are found beside the DLL.
# Extract prices from the regulation.bin actually used by your modded game.
# The installed local profile has real selling enabled after live verification.
enabled=true
dry_run=true
native_sale_enabled=true
native_sale_max_items=0
supported_game_version=2.7.1.0
hotkey_vk=0x77

# Equipped copies first, then highest upgrade; all equipped copies are protected.
# Weapon affinities share a base family. Talismans and armor use their exact IDs.
keep_weapons=2
keep_shields=2
keep_armor=1
keep_talismans=1
keep_ashes_of_war=2
sell_weapons=true
sell_shields=true
sell_armor=true
sell_talismans=true
sell_ashes_of_war=true
sell_spells=false
sell_consumables=false
item_stock_rules=

sell_value_path=sell_values.txt
metadata_iteminfo_path=

# Optional read-only diagnostics use the same validated inventory layout.
inventory_read_enabled=true
inventory_base_chain=[module+0x3d61f98]+0x8+0x0
inventory_array_offset=0x418
inventory_count_offset=0x420
inventory_capacity_offset=0x414
inventory_entry_stride=0x18
inventory_handle_offset=0x0
inventory_itemid_offset=0x4
inventory_quantity_offset=0x8
inventory_max_entries=4096
inventory_snapshot_export_enabled=false
inventory_snapshot_auto_interval_seconds=0
inventory_snapshot_auto_run_on_start=false
inventory_snapshot_auto_dry_run_report_enabled=false
